[package]
name = "victini"
version = "0.1.0"
edition = "2021"
authors = ["Vmax Martis <vmax@elegans.ai>"]
description = "Victini — Ultra-Lightweight Rust Native Vibe-Code IDE with AGY AI Core & Notionists Animated Avatars"

[dependencies]
# UI Framework
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["svg", "image"] }

# Git Engine
git2 = { version = "0.19", features = ["vendored-libgit2"] }
similar = { version = "2.6", features = ["inline"] }
ropey = "1.6"

# Async & Networking
tokio = { version = "1.40", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["connect"] }
reqwest = { version = "0.12", features = ["json"] }
futures-util = "0.3"

# Serialization & Core Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
walkdir = "2"
sha2 = "0.10"
once_cell = "1"
base64 = "0.22"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
